name: Deploy work flow for Amazon ECS

on:
  pull_request:
    branches:
      - main
    types: [closed]

env:
  AWS_REGION: ap-northeast-1
  ECS_WEBAPP_SERVICE: ecs-sample-webapp
  ECS_RESTAPI_SERVICE: ecs-sample-restapi
  WEBAPP_CONTAINER_NAME: ecs-sample-webapp
  BACKEND_CONTAINER_NAME: ecs-sample-backend
  RESTAPI_CONTAINER_NAME: ecs-sample-restapi
  WEBAPP_TAG: 1.0.0
  BACKEND_TAG: 1.0.0
  RESTAPI_TAG: 1.0.0
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  TASK_WEBAPP: ecs-sample-webapp-task-def
  TASK_RESTAPI: ecs-sample-restapi
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: webapp push to ECR
        id: build-image-webapp
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd sample-webapp
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$WEBAPP_CONTAINER_NAME:$WEBAPP_TAG .
          docker tag $ECR_REGISTRY/$WEBAPP_CONTAINER_NAME:$WEBAPP_TAG $ECR_REGISTRY/$WEBAPP_CONTAINER_NAME:latest
          docker push $ECR_REGISTRY/$WEBAPP_CONTAINER_NAME:$WEBAPP_TAG
          docker push $ECR_REGISTRY/$WEBAPP_CONTAINER_NAME:latest

      - name: backend push to ECR
        id: build-image-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd sample-backend
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$BACKEND_CONTAINER_NAME:$BACKEND_TAG .
          docker tag $ECR_REGISTRY/$BACKEND_CONTAINER_NAME:$BACKEND_TAG $ECR_REGISTRY/$BACKEND_CONTAINER_NAME:latest
          docker push $ECR_REGISTRY/$BACKEND_CONTAINER_NAME:$BACKEND_TAG
          docker push $ECR_REGISTRY/$BACKEND_CONTAINER_NAME:latest

      - name: restapi push to ECR
        id: build-image-restapi
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd sample-restapi
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$RESTAPI_CONTAINER_NAME:$RESTAPI_TAG .
          docker tag $ECR_REGISTRY/$RESTAPI_CONTAINER_NAME:$RESTAPI_TAG $ECR_REGISTRY/$RESTAPI_CONTAINER_NAME:latest
          docker push $ECR_REGISTRY/$RESTAPI_CONTAINER_NAME:$RESTAPI_TAG
          docker push $ECR_REGISTRY/$RESTAPI_CONTAINER_NAME:latest

      - name: Update task definition image
        id: update-task-definition
        run: |
          IMAGE_URI_WEBAPP="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ecs-sample-webapp:latest"
          IMAGE_URI_BACKEND="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ecs-sample-backend:latest"
          aws ecs describe-task-definition \
          --task-definition "$TASK_WEBAPP" \
          --query 'taskDefinition' \
          --output json > current_task_webapp_def.json

          cat current_task_webapp_def.json | jq ' .containerDefinitions |= (map(if .name == "sample-webapp" then .image = env.IMAGE_URI_WEBAPP elif .name == "sample-backend" then .image = env.IMAGE_URI_BACKEND else . end)) | del(.revision, .status, .requiresAttributes, .compatibilities, .taskDefinitionArn, .registeredAt, .registeredBy)' > new_task_webapp_def.json
          NEW_TASK_WEBAPP_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://new_task_webapp_def.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
          echo "NEW_TASK_WEBAPP_DEF_ARN=$NEW_TASK_WEBAPP_DEF_ARN" >> "$GITHUB_OUTPUT"

          IMAGE_URI_RESTAPI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ecs-sample-restapi:latest"
          aws ecs describe-task-definition \
          --task-definition "$TASK_RESTAPI" \
          --query 'taskDefinition' \
          --output json > current_task_restapi_def.json

          cat current_task_restapi_def.json | jq ' .containerDefinitions |= (map(if .name == "sample-restapi" then .image = env.IMAGE_URI_RESTAPI  else . end)) | del(.revision, .status, .requiresAttributes, .compatibilities, .taskDefinitionArn, .registeredAt, .registeredBy)' > new_task_restapi_def.json
          NEW_TASK_RESTAPI_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://new_task_restapi_def.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
          echo "NEW_TASK_RESTAPI_DEF_ARN=$NEW_TASK_RESTAPI_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
          --cluster ecs-lesson-cluster \
          --service $ECS_WEBAPP_SERVICE \
          --task-definition "${{ steps.update-task-definition.outputs.NEW_TASK_WEBAPP_DEF_ARN }}" \
          --force-new-deployment \

          aws ecs update-service \
          --cluster ecs-lesson-cluster \
          --service $ECS_RESTAPI_SERVICE \
          --task-definition "${{ steps.update-task-definition.outputs.NEW_TASK_RESTAPI_DEF_ARN }}" \
          --force-new-deployment

      - name: Success
        uses: rtCamp/action-slack-notify@v2.0.2
        if: success()
        env:
          SLACK_TITLE: Deploy flow / success
          SLACK_COLOR: good
          SLACK_MESSAGE: Message for success

      - name: Failure
        uses: rtCamp/action-slack-notify@v2.0.2
        if: failure()
        env:
          SLACK_TITLE: Deploy flow / failure
          SLACK_COLOR: danger
          SLACK_MESSAGE: Message for failure

      - name: Cancel
        uses: rtCamp/action-slack-notify@v2.0.2
        if: cancelled()
        env:
          SLACK_TITLE: Deploy flow / cancel
          SLACK_COLOR: danger
          SLACK_MESSAGE: Message for cancel
